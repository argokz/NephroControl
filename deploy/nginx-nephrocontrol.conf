# ===========================================================
# НефроКонтроль — статическое SPA (Vue), без бэкенда.
# Вставить внутрь server { ... } (443 itwin.kz и, для локальной
# проверки, server 80 localhost). Сборка: npm run build.
# ===========================================================
location = /nephrocontrol {
    return 301 $scheme://$host/nephrocontrol/;
}

location ^~ /nephrocontrol/assets/ {
    alias H:/projects/NephroControl/dist/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff";
}

location ^~ /nephrocontrol/ {
    alias H:/projects/NephroControl/dist/;
    index index.html;
    try_files $uri $uri/ /nephrocontrol/index.html;
    # index.html не кэшируется — после пересборки сразу подхватываются новые ресурсы.
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
}
